spring.application.name=ecm

spring.profiles.active=dev

# Carga backend/.env si existe (ejecutar desde backend/). Las variables de entorno del sistema tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# Administrador inicial (DataSeeder)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@ecm.com}
app.admin.password=${ADMIN_PASSWORD:}
