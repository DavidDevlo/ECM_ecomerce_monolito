<header class="site-header">

  <a class="brand" routerLink="/">
    <img src="assets/images/ecm-icon-badge.png" alt="ECM · Tu estilo, tu identidad" />
  </a>

  <nav class="main-nav">
    <a routerLink="/home" routerLinkActive="active">Inicio</a>
    <a routerLink="/products" routerLinkActive="active">Productos</a>
    <a routerLink="/profile" routerLinkActive="active">Perfil</a>

    @if (viewMode.activeView() === 'ADMIN') {
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
    }
  </nav>

  <div class="actions">

    <button
      class="icon-btn theme-toggle"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    >
      @if (theme.theme() === 'dark') {
        <!-- sol -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      } @else {
        <!-- luna -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
      }
    </button>

    <app-view-switcher />

    @if (viewMode.canShop() && auth.isLoggedIn()) {
      <a class="icon-btn wishlist-btn" routerLink="/wishlist" aria-label="Lista de deseos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/>
        </svg>
        @if (wishlist.itemCount() > 0) {
          <span class="badge">{{ wishlist.itemCount() }}</span>
        }
      </a>
    }

    @if (showCart()) {
      <button class="icon-btn cart-btn" type="button" (click)="cart.toggle()" aria-label="Carrito de compras">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
        </svg>
        @if (cart.itemCount() > 0) {
          <span class="badge">{{ cart.itemCount() }}</span>
        }
      </button>
    }

    @if (auth.isLoggedIn()) {
      <button class="text-btn" type="button" (click)="logout()">Cerrar sesión</button>
    } @else {
      <a class="text-btn" routerLink="/login">Iniciar sesión</a>
    }

  </div>

</header>

<app-cart-drawer />
<app-toast-container />
